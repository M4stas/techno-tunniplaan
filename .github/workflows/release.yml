name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v1.2.3 becomes versionName 1.2.3 and versionCode 10203.
      # v1.2.3-beta.1 becomes a pre-release and must be tagged on dev or main.
      # A stable tag must point at a commit on main.
      - name: Read version from tag
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $tag is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          suffix="${BASH_REMATCH[4]}"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must be 99 or lower so versionCode stays ordered"
            exit 1
          fi
          git fetch --no-tags origin main dev
          if [[ -z "$suffix" ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::Stable tag $tag is not on main"; exit 1; }
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || git merge-base --is-ancestor "$GITHUB_SHA" origin/dev \
              || { echo "::error::Pre-release tag $tag is not on dev or main"; exit 1; }
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TECHNO_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TECHNO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TECHNO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TECHNO_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret TECHNO_RELEASE_$name is not set"
              missing=1
            fi
          done
          (( missing == 0 )) || exit 1
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - run: ./gradlew testDebugUnitTest

      # Gradle reads ORG_GRADLE_PROJECT_<name> as the project property <name>.
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_TECHNO_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_TECHNO_RELEASE_STORE_PASSWORD: ${{ secrets.TECHNO_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_TECHNO_RELEASE_KEY_ALIAS: ${{ secrets.TECHNO_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_TECHNO_RELEASE_KEY_PASSWORD: ${{ secrets.TECHNO_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --print-certs "$apk"
          cp "$apk" "techno-tunniplaan-${{ steps.version.outputs.name }}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            "techno-tunniplaan-${{ steps.version.outputs.name }}.apk" \
            --title "${{ steps.version.outputs.name }}" \
            --generate-notes --verify-tag "${flags[@]}"
